title: The Observer Effect
description: >-
  Observing the world through the lens of curiosity —
  articles on tech, science, and everything in between.
url: "https://noobxlad.github.io"         # Set to your GitHub Pages URL, e.g. https://username.github.io
baseurl: "/the-observer-effect"     # Set if using a project page, e.g. /repo-name

author:
  name: "Noob"
  bio: "Curious mind exploring the intersection of technology and science."

twitter:
  card: summary_large_image

permalink: /articles/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      toc: true
      image: /assets/images/default-share-card.jpg
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  toc_levels: "2..3"
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Category configuration
collections_dir: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
